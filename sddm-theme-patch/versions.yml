# Supported lliurex-sddm-theme versions for this patch.
#
# Main.qml.patched was generated (see apply_patch.py) from a pristine
# Main.qml taken from the dpkg version listed below. Before patching a
# machine, install.sh MUST check its installed lliurex-sddm-theme version
# against this list and refuse to patch (without --force) if it does not
# match, and MUST compare sha256 of the installed Main.qml against both
# shas below before touching anything.
#
# Regenerate this file (and Main.qml.patched / Main.qml.patch.txt) with:
#   cp /usr/share/sddm/themes/lliurex/Main.qml sddm-theme-patch/Main.qml.pristine
#   python3 sddm-theme-patch/apply_patch.py
#   diff -u Main.qml.pristine Main.qml.patched > Main.qml.patch.txt
# then add the new dpkg version below.

supported_versions:
  - theme_version: "23.8.0.0"
    verified_on: "2026-11-06"
    verified_host: "prn5-10366948 (ThinkPad test machine)"
    sha256_pristine: "8c30d0e90fdccf6c63056fd91851e2ea90f200844d984b770c38812c31c3f824"
    sha256_patched: "d2af24f7586045556eea6dfca5f7aa33dc6d337e8e1c4b98b274de72f48df901"
    # Further cosmetic tweaks, ad hoc while testing, on top of
    # 90c4fe1b9a2e28e3f3a4ec228e6020e9437d4cff9aa1450d78a802ab7823d82d:
    #   - background panel color changed from light blue (#d6e9f8) to
    #     light mint green (#dcf2dc) - chosen from a small on-screen
    #     preview of several candidates, see AGENTS.md.
    #   - pilot-active label reworded to "Asistente de acceso" / "Assistent
    #     d'accés", and actually language-switched via explainerLang()
    #     instead of a static i18nd() string with no real translation.
    #   - login box enlarged ~10% (400x340 -> 440x374) and every text
    #     element's font bumped ~10% relative to Kirigami.Theme's own
    #     default size (not a hardcoded absolute size).
    #
    # Earlier history, also on top of the previous (working) patched
    # version (eac31ce17f04f63b775cceb747b2069238b4db62dbb50b8ac849880dfb483de1):
    # a light-blue background panel behind the login box content, without
    # touching qml-module-lliurex-ui's Window.qml (which owns the window's
    # own gray background and isn't patched by this project - see
    # AGENTS.md), and the pilot-active label itself first added.
    # Superseded two earlier sha256_patched values, both found live on
    # real test machines (see AGENTS.md for the full story):
    #   d522f4323a40a77b9b1a6c33a4ddc35c948519e500d5e33b2350d7a9932e170c
    #     - Qt.locale().name() called as a method instead of accessing
    #       the .name property; threw a TypeError that silently aborted
    #       onLoginFailed() before the AccessExplainer N4D call ever ran.
    #   056c0f0edc76878f1ca69a39289d36cab402e9207a6a117a7c7175d4b4b14a30
    #     - fixed the above, but the message box's wrapping Item had a
    #       fixed height:32 and the InlineMessage used
    #       anchors.fill:parent, clipping our longer (1-2 sentence)
    #       messages to only their tail end. InlineMessage's own docs say
    #       to avoid setting its height and let it manage implicitHeight
    #       instead.
